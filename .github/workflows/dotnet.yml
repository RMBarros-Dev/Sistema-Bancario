name: Sistema Bancario CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sistema-bancario-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Restore, build and run xUnit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore application
        run: dotnet restore "Sistema Bancario/Sistema Bancario.csproj"

      - name: Build application
        run: dotnet build "Sistema Bancario/Sistema Bancario.csproj" --configuration Release --no-restore

      - name: Run xUnit tests
        run: dotnet test "SistemaBancario.Tests/SistemaBancario.Tests.csproj" --configuration Release

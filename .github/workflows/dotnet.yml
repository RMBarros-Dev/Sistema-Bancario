name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore "Sistema Bancario/Sistema Bancario.csproj"

    - name: Build
      run: dotnet build --no-restore "Sistema Bancario/Sistema Bancario.csproj" -c Release

    - name: Test
      run: |
        dotnet test "SistemaBancario.Tests/SistemaBancario.Tests.csproj" --no-build -c Release
